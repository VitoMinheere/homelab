apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forgejo-runner
  namespace: forgejo
spec:
  podSelector:
    matchLabels:
      policy-type: app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector: {}
    - ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
    # Forgejo NodePort (192.168.2.24:30285) — a node IP, not a pod, so it isn't
    # covered by the namespaceSelector or 80/443-only rules above.
    - to:
        - ipBlock:
            cidr: 192.168.2.0/24
      ports:
        - port: 30285
          protocol: TCP
