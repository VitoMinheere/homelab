apiVersion: apps/v1
kind: Deployment
metadata:
  name: grocy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grocy
  template:
    metadata:
      labels:
        app: grocy
    spec:
      containers:
        - name: grocy
          image: lscr.io/linuxserver/grocy:4.7.0
          envFrom:
            - configMapRef:
                name: grocy-configmap
          # ports:
          #   - containerPort: 9283
          #     protocol: TCP

          volumeMounts:
            - name: grocy-storage
              mountPath: /var/www/data

      volumes:
        - name: grocy-storage
          persistentVolumeClaim:
            claimName: grocy-storage
      