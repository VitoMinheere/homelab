apiVersion: v1
data:
  config.yaml: |
    log:
      level: info

    runner:
      capacity: 1
      timeout: 3h
      insecure: false
      fetch_timeout: 5s
      fetch_interval: 2s
      envs:
        DOCKER_HOST: tcp://localhost:2375
      labels:
        - "docker:docker://ghcr.io/catthehacker/ubuntu:act-22.04"
        - "ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-22.04"
        - "hugo:docker://floryn90/hugo:0.145.0-ext-alpine"

    cache:
      enabled: true
      dir: /data/cache

    container:
      network: host
      privileged: false
      options:
      valid_volumes: []
      docker_host: tcp://localhost:2375

    server:
      connections:
        forgejo-claude:
          url: http://192.168.2.24:30285/
          uuid: 6ed1084f-bce8-41c7-8202-3838d0079c75
          token_url: file:/secrets/runner-token/token
kind: ConfigMap
metadata:
  name: forgejo-runner-claude-config
  namespace: forgejo
