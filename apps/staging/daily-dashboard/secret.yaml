# NOT ENCRYPTED YET - fill in the values, then encrypt in place before merging:
#   sops --encrypt --in-place apps/staging/daily-dashboard/secret.yaml
# (and delete this comment block). Every value must show as ENC[...].
apiVersion: v1
kind: Secret
metadata:
  name: daily-dashboard-garmin
  namespace: daily-dashboard
type: Opaque
stringData:
  # Only used when the token store on the garmin-tokens PVC is unusable.
  GARMIN_EMAIL: REPLACE_ME
  GARMIN_PASSWORD: REPLACE_ME
  DATABASE_URL: postgresql://daily_dashboard:REPLACE_ME@postgres.postgres.svc.cluster.local:5432/daily_dashboard
