# NOT ENCRYPTED YET.
# Fill in the real values below, then encrypt this file in place before
# committing, matching every other secret.yaml in apps/staging/*:
#   sops -e -i apps/staging/garmin-grafana/secret.yaml
# (repo's sops config: clusters/staging/.sops.yaml)
#
# INFLUXDB_USERNAME/INFLUXDB_PASSWORD are garmin-fetch-data's client
# credentials for the shared InfluxDB (apps/base/influxdb). They must match
# INFLUXDB_USER/INFLUXDB_USER_PASSWORD in apps/staging/influxdb/secret.yaml
# and the password in
# monitoring/configs/staging/garmin-influxdb-datasource/secret.yaml - same
# account, three separate namespaces, so three separate Secrets.
#
# GARMINCONNECT_EMAIL / GARMINCONNECT_BASE64_PASSWORD are optional and only
# work if you do NOT have 2FA on your Garmin account - GARMINCONNECT_BASE64_PASSWORD
# must be your Garmin password Base64-encoded (not plaintext). If you have 2FA
# enabled, delete both of these keys entirely (an empty/placeholder value will
# cause the container to attempt an invalid login) and do the one-time
# interactive login instead - see chat for instructions.
apiVersion: v1
kind: Secret
metadata:
  name: garmin-grafana-secrets
  namespace: garmin-grafana
type: Opaque
stringData:
  INFLUXDB_USERNAME: "influxdb_user"
  INFLUXDB_PASSWORD: "CHANGE_ME"
  GARMINCONNECT_EMAIL: "you@example.com"
  GARMINCONNECT_BASE64_PASSWORD: "<base64-encoded Garmin Connect password>"
