# NOT ENCRYPTED YET.
# Fill in the real password, then encrypt this file in place before
# committing, matching every other secret.yaml in apps/staging/*:
#   sops -e -i apps/staging/influxdb/secret.yaml
# (repo's sops config: clusters/staging/.sops.yaml)
#
# INFLUXDB_USER_PASSWORD here must match INFLUXDB_PASSWORD in
# apps/staging/garmin-grafana/secret.yaml (garmin-fetch-data's client
# credentials) and the password in
# monitoring/configs/staging/garmin-influxdb-datasource/secret.yaml
# (Grafana's datasource credentials) - three places, one shared account,
# because each is a separate namespace and Secrets don't cross namespaces.
apiVersion: v1
kind: Secret
metadata:
  name: influxdb-container-env
  namespace: influxdb
type: Opaque
stringData:
  INFLUXDB_USER: "influxdb_user"
  INFLUXDB_USER_PASSWORD: "CHANGE_ME"
