apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - secret.yaml
# Picked up by the kube-prometheus-stack Grafana sidecar through the

# README / is edited here directly.
configMapGenerator:
  - name: daily-dashboard-grafana-dashboards
    files:
      - health-dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
