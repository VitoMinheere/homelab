# NOT ENCRYPTED YET - fill in grafana_dashboard's password, then encrypt in
# place before merging:
#   sops --encrypt --in-place monitoring/configs/staging/daily-dashboard/secret.yaml
# (and delete this comment block). The value must show as ENC[...].
#
# A Grafana datasource provisioning file, picked up by the kube-prometheus-stack
# Grafana sidecar through the grafana_datasource label. grafana_dashboard is a
# member of dashboard_reader: SELECT on the dashboard views only.
apiVersion: v1
kind: Secret
metadata:
  name: daily-dashboard-datasource
  labels:
    grafana_datasource: "1"
type: Opaque
stringData:
  daily-dashboard-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Daily dashboard
        uid: daily-dashboard-pg
        type: grafana-postgresql-datasource
        access: proxy
        url: postgres.postgres.svc.cluster.local:5432
        user: grafana_dashboard
        jsonData:
          database: daily_dashboard
          sslmode: disable
          postgresVersion: 1500
          timescaledb: false
        secureJsonData:
          password: REPLACE_ME
