# NOT ENCRYPTED YET.
# Fill in the real password below (must match INFLUXDB_USER_PASSWORD in
# apps/staging/influxdb/secret.yaml), then encrypt in place:
#   sops -e -i monitoring/configs/staging/garmin-influxdb-datasource/secret.yaml
# If sops doesn't auto-find the repo's config from this path, pass it
# explicitly: --config clusters/staging/.sops.yaml
#
# Picked up by the kube-prometheus-stack Grafana sidecar (grafana.sidecar.datasources,
# see monitoring/controllers/base/kube-prometheus-stack/release.yaml) because it
# lives in the monitoring namespace and carries the grafana_datasource label -
# it adds this as a datasource to your existing Grafana at :30300, no separate
# Grafana instance needed.
apiVersion: v1
kind: Secret
metadata:
  name: garmin-influxdb-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
type: Opaque
stringData:
  influxdb.yaml: |
    apiVersion: 1
    datasources:
      - name: Garmin-InfluxDB
        uid: garmin_influxdb
        type: influxdb
        access: proxy
        url: http://influxdb.influxdb.svc.cluster.local:8086
        user: influxdb_user
        database: GarminStats
        isDefault: false
        editable: true
        secureJsonData:
          password: CHANGE_ME
        jsonData:
          httpMode: GET
