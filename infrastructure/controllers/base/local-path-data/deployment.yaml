apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-path-data-provisioner
  namespace: local-path-storage
  labels:
    app: local-path-data-provisioner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-path-data-provisioner
  template:
    metadata:
      labels:
        app: local-path-data-provisioner
    spec:
      serviceAccountName: local-path-data-provisioner
      containers:
        - name: local-path-data-provisioner
          image: docker.io/rancher/local-path-provisioner:v0.0.37
          imagePullPolicy: IfNotPresent
          command:
            - local-path-provisioner
            - --debug
            - start
            - --config
            - /etc/config/config.json
            - --provisioner-name
            - rancher.io/local-path-data
            - --configmap-name
            - local-path-data-config
            - --service-account-name
            - local-path-data-provisioner
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config/
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIG_MOUNT_PATH
              value: /etc/config/
            - name: HEALTH_PORT
              value: "8080"
      volumes:
        - name: config-volume
          configMap:
            name: local-path-data-config
